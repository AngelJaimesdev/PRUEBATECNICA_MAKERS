spring.application.name=prestamos
server.port=8090

# H2 en memoria: corre sin instalar nada. Para PostgreSQL ver el bloque comentado al final.
spring.datasource.url=jdbc:h2:mem:prestamosdb
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# Las consultas se resuelven dentro de la transacción del servicio, no al renderizar la respuesta.
spring.jpa.open-in-view=false

# JWT: en producción la clave se inyecta con la variable de entorno JWT_SECRET (mínimo 32 caracteres).
app.jwt.secret=${JWT_SECRET:clave-de-desarrollo-cambiar-en-produccion-32b}
app.jwt.expiracion-minutos=60

app.cors.origen=http://localhost:4200


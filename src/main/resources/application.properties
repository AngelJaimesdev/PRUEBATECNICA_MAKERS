spring.application.name=prestamos
server.port=8090

spring.datasource.url=jdbc:h2:mem:prestamosdb
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:clave-de-desarrollo-cambiar-en-produccion-32b}
app.jwt.expiracion-minutos=60

app.cors.origen=http://localhost:4200


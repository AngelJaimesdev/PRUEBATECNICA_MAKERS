<main class="pantalla">
  <section class="tarjeta login">
    <h2>Iniciar Sesión</h2>
    <p class="subtitulo">Ingrese sus credenciales para acceder</p>

    @if (error()) {
      <p class="alerta alerta-error" role="alert">{{ error() }}</p>
    }

    <form [formGroup]="form" (ngSubmit)="ingresar()" novalidate>
      <div class="campo">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="Email"
          autocomplete="username"
          [class.invalido]="invalido('email')"
        />
        @if (invalido('email')) {
          <small class="error-campo">
            @if (form.controls.email.hasError('required')) {
              El email es obligatorio
            } @else {
              Ingrese un email válido
            }
          </small>
        }
      </div>

      <div class="campo">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="Contraseña"
          autocomplete="current-password"
          [class.invalido]="invalido('password')"
        />
        @if (invalido('password')) {
          <small class="error-campo">La contraseña es obligatoria</small>
        }
      </div>

      <button type="submit" class="btn btn-primario btn-bloque" [disabled]="cargando()">
        {{ cargando() ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>
  </section>
</main>
